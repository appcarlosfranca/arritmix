<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CF ArritmiX</title></head><body style="background:#07101c;color:#e8f3ff;font-family:system-ui"><p id="status" role="status">Carregando ArritmiX…</p><script>
window.__arritmixParts=[];
const files=["arritmix-parte-01.js", "arritmix-parte-02.js", "arritmix-parte-03.js", "arritmix-parte-04.js", "arritmix-parte-05.js", "arritmix-parte-06.js", "arritmix-parte-07.js", "arritmix-parte-08.js", "arritmix-parte-09.js", "arritmix-parte-10.js", "arritmix-parte-11.js", "arritmix-parte-12.js", "arritmix-parte-13.js"];
(async()=>{try{const decoder=new TextDecoder('utf-8',{fatal:true}),text=[];for(const name of files){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=name;s.onload=()=>{s.remove();resolve()};s.onerror=()=>reject(new Error(name));document.head.appendChild(s)});const binary=atob(window.__arritmixParts.pop()),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);text.push(decoder.decode(bytes,{stream:true}));document.getElementById('status').textContent='Carregando ArritmiX… '+text.length+'/'+files.length;}text.push(decoder.decode());const html=text.join('');delete window.__arritmixParts;document.open();document.write(html);document.close()}catch(error){document.getElementById('status').textContent='Não foi possível carregar. Confirme que todos os arquivos arritmix-parte estão junto do index.html.';console.error(error)}})();
</script></body></html>
